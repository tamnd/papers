# The controlled vocabulary: one rendering per term per language, chosen once
# and used everywhere.
#
# Reviewed by hand out of glossary-candidates.yaml, which is machine written
# and is a proposal rather than a decision. About a third of the 300 proposed
# terms survived. What was dropped was ordinary English that happened to be
# frequent in a corpus of papers ("achieve", "additional", "useful"), words
# that are only ever part of a longer term here ("hidden", "neural"), and
# words with no translation problem in them at all.
#
# A term with no field is offered to every paper. A term with a field is
# offered to that field only, because a rendering offered to the wrong paper
# is worse than none: the translator will take it.
#
# A term with keep set stands in English in all three languages, and that is a
# decision somebody made rather than a gap in the table.
#
# Renderings are filled in by `papers glossary translate` and checked by hand.
# Bump version whenever a term is added or a rendering changes: every
# translated file records the version it was made under, so a change here
# makes the files it affects detectably stale.
