# The corpus manifest: one entry per paper.
#
# Entries 1 to 100 are the seed canon and keep their number for ever, so a reader who arrives from the numbered list can find entry 63.
# Papers added afterwards by `papers add` have no number, so the hundred stay a hundred while the corpus grows.
#
# `expect` is a guess at the access class, made before any resolution has run.
# It is not a fact and nothing is fetched on the strength of it.
# The fact lives in manifests/sources.yaml and is written by `papers resolve`, which either confirms the guess or leaves the paper unresolved.
#
# `authors_partial: true` marks a seed entry whose author list is cut short because the paper has more authors than are worth typing by hand.
# The resolver replaces the list with the published one.
#
# `status` is one of: listed, fetched, extracted, translated, done.

