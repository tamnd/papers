# Which page of the file is which page of the paper.
#
# Written by `papers pagemap`, one file per paper.
#
# `offset` is what to add to a page of the file to get the page the paper prints. It is null for a paper whose pages print no numbers, and zero for a preprint that starts at one.
# `printed` is the folio the page itself printed, and is absent for a page that printed none.
# `size` is the width and the height of the page in points, which is what makes the bounding boxes in figures.yaml mean something.

paper: jouppi-1990-victimcache
offset: 363
pages:
    - pdf: 1
      printed: "364"
      size: [612, 792]
      columns: 2
    - pdf: 2
      printed: "365"
      size: [614, 793]
      columns: 2
      figures: [f01]
    - pdf: 3
      size: [612, 792]
      columns: 2
    - pdf: 4
      size: [614, 793]
      columns: 2
      figures: [f02, f03]
    - pdf: 5
      printed: "368"
      size: [612, 792]
      columns: 2
      figures: [f04, f05]
    - pdf: 6
      printed: "369"
      size: [613, 793]
      columns: 2
      figures: [f06, f07]
    - pdf: 7
      size: [614, 793]
      columns: 2
      figures: [f08, f09]
    - pdf: 8
      printed: "371"
      size: [613, 793]
      columns: 2
      figures: [f10, f11, f12]
    - pdf: 9
      printed: "372"
      size: [616, 797]
      columns: 2
      figures: [f13, f14]
    - pdf: 10
      size: [614, 793]
      columns: 2
      figures: [f15]
