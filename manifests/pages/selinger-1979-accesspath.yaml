# Which page of the file is which page of the paper.
#
# Written by `papers pagemap`, one file per paper.
#
# `offset` is what to add to a page of the file to get the page the paper prints. It is null for a paper whose pages print no numbers, and zero for a preprint that starts at one.
# `printed` is the folio the page itself printed, and is absent for a page that printed none.
# `size` is the width and the height of the page in points, which is what makes the bounding boxes in figures.yaml mean something.

paper: selinger-1979-accesspath
offset: 22
pages:
    - pdf: 1
      printed: "23"
      size: [612, 792]
      columns: 2
    - pdf: 2
      printed: "24"
      size: [612, 792]
      columns: 2
    - pdf: 3
      printed: "25"
      size: [612, 792]
      columns: 2
    - pdf: 4
      printed: "26"
      size: [612, 792]
      columns: 1
    - pdf: 5
      printed: "27"
      size: [612, 792]
      columns: 2
    - pdf: 6
      printed: "28"
      size: [612, 792]
      columns: 2
    - pdf: 7
      printed: "29"
      size: [612, 792]
      columns: 2
    - pdf: 8
      printed: "30"
      size: [612, 792]
      columns: 2
      figures: [f01, f02]
    - pdf: 9
      printed: "31"
      size: [612, 792]
      columns: 2
      figures: [f03, f04]
    - pdf: 10
      printed: "32"
      size: [612, 792]
      columns: 1
      figures: [f05, f06]
    - pdf: 11
      printed: "33"
      size: [612, 792]
      columns: 2
    - pdf: 12
      printed: "34"
      size: [612, 792]
      columns: 2
