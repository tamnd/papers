# Which page of the file is which page of the paper.
#
# Written by `papers pagemap`, one file per paper.
#
# `offset` is what to add to a page of the file to get the page the paper prints. It is null for a paper whose pages print no numbers, and zero for a preprint that starts at one.
# `printed` is the folio the page itself printed, and is absent for a page that printed none.
# `size` is the width and the height of the page in points, which is what makes the bounding boxes in figures.yaml mean something.

paper: patterson-1981-risc
offset: 215
pages:
    - pdf: 1
      printed: "216"
      size: [615, 795]
      columns: 2
    - pdf: 2
      printed: "217"
      size: [615, 795]
      columns: 2
    - pdf: 3
      printed: "218"
      size: [618, 797]
      columns: 2
    - pdf: 4
      printed: "219"
      size: [615, 795]
      columns: 2
    - pdf: 5
      printed: "220"
      size: [615, 795]
      columns: 2
    - pdf: 6
      printed: "221"
      size: [614, 794]
      columns: 2
    - pdf: 7
      printed: "222"
      size: [618, 797]
      columns: 2
    - pdf: 8
      printed: "223"
      size: [615, 795]
      columns: 1
    - pdf: 9
      printed: "224"
      size: [614, 794]
      columns: 1
      figures: [f01, f02]
    - pdf: 10
      printed: "225"
      size: [613, 793]
      columns: 2
      figures: [f03, f04]
    - pdf: 11
      printed: "226"
      size: [620, 798]
      columns: 1
      figures: [f05]
    - pdf: 12
      printed: "227"
      size: [613, 793]
      columns: 2
      figures: [f06, f07]
    - pdf: 13
      printed: "228"
      size: [612, 793]
