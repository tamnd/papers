# Which page of the file is which page of the paper.
#
# Written by `papers pagemap`, one file per paper.
#
# `offset` is what to add to a page of the file to get the page the paper prints. It is null for a paper whose pages print no numbers, and zero for a preprint that starts at one.
# `printed` is the folio the page itself printed, and is absent for a page that printed none.
# `size` is the width and the height of the page in points, which is what makes the bounding boxes in figures.yaml mean something.

paper: royce-1970-lifecycle
offset: 327
pages:
    - pdf: 1
      size: [612, 792]
      columns: 1
      figures: [f01]
    - pdf: 2
      printed: "329"
      size: [612, 792]
      columns: 1
      figures: [f02]
    - pdf: 3
      printed: "330"
      size: [612, 792]
      columns: 1
      figures: [f03, f04]
    - pdf: 4
      printed: "331"
      size: [612, 792]
      columns: 1
      figures: [f05]
    - pdf: 5
      printed: "332"
      size: [612, 792]
      columns: 1
    - pdf: 6
      printed: "333"
      size: [612, 792]
      columns: 4
    - pdf: 7
      printed: "334"
      size: [612, 792]
      columns: 1
      figures: [f06]
    - pdf: 8
      printed: "335"
      size: [612, 792]
      columns: 1
    - pdf: 9
      printed: "336"
      size: [612, 792]
      columns: 1
    - pdf: 10
      printed: "337"
      size: [612, 792]
      columns: 1
    - pdf: 11
      printed: "338"
      size: [612, 792]
      columns: 1
