# Which page of the file is which page of the paper.
#
# Written by `papers pagemap`, one file per paper.
#
# `offset` is what to add to a page of the file to get the page the paper prints. It is null for a paper whose pages print no numbers, and zero for a preprint that starts at one.
# `printed` is the folio the page itself printed, and is absent for a page that printed none.
# `size` is the width and the height of the page in points, which is what makes the bounding boxes in figures.yaml mean something.

paper: verma-2015-borg
offset: null
pages:
    - pdf: 1
      size: [612, 792]
      columns: 2
      figures: [f01]
    - pdf: 2
      size: [612, 792]
      columns: 2
      figures: [f02]
    - pdf: 3
      size: [612, 792]
      columns: 2
    - pdf: 4
      size: [612, 792]
      columns: 2
    - pdf: 5
      size: [612, 792]
      columns: 2
    - pdf: 6
      size: [612, 792]
      columns: 2
      figures: [f03, f04]
    - pdf: 7
      size: [612, 792]
      columns: 2
      figures: [f05, f06]
    - pdf: 8
      size: [612, 792]
      columns: 2
      figures: [f07]
    - pdf: 9
      size: [612, 792]
      columns: 2
      figures: [f08, f09, f10, f11]
    - pdf: 10
      size: [612, 792]
      columns: 2
      figures: [f12, f13]
    - pdf: 11
      size: [612, 792]
      columns: 2
    - pdf: 12
      size: [612, 792]
      columns: 2
    - pdf: 13
      size: [612, 792]
      columns: 2
    - pdf: 14
      size: [612, 792]
      columns: 2
    - pdf: 15
      size: [612, 792]
      columns: 2
    - pdf: 16
      size: [612, 792]
      columns: 2
    - pdf: 17
      size: [612, 792]
      columns: 2
    - pdf: 18
      size: [612, 792]
      columns: 1
