    - key: "45"
      raw: 'Zhou, J., Cao, Y., Wang, X., Li, P., and Xu, W. Deep recurrent models with fast-forward connections for neural machine translation. CoRR abs/1606.04199 (2016). Table 11: Some example translations from PBMT [15], our GNMT system (the "NMT before RL", Table 9), and Human. Source and target sentences (human translations) are from the public benchmark WMT En→Fr (newstest2014) data set. The right-hand column shows the human ratings on a scale of 0 (complete nonsense) to 6 (perfect translation). We disagree with some of the human ratings, e.g., the translation “Elle a été repéré trois jours plus tard par un promeneur de chien piégé dans la carrière” contains grammatical mistakes and changes semantics, and is still scored 6. We present it to illustrate the potential problems of the scoring process. | | Source | PBMT | GNMT | Human | | | --- | --- | --- | --- | --- | --- | | "The reason Boeing are doing this is to cram more seats in to make their plane more competitive with our products," said Kevin Keniston, head of passenger comfort at Europe’s Airbus. | | "La raison pour laquelle Boeing sont en train de faire, c’est de concentrer davantage de sièges pour prendre leur avion plus compétitive avec nos produits", a déclaré Kevin M. Keniston, chef du confort des passagers de l’Airbus de l’Europe. | "La raison pour laquelle Boeing fait cela est de créer plus de sièges pour rendre son avion plus compétitif avec nos produits", a déclaré Kevin Keniston, chef du confort des passagers chez Airbus. | "Boeing fait ça pour pouvoir caser plus de sièges et rendre ses avions plus compétitifs par rapports à nos produits", a déclaré Kevin Keniston, directeur de Confort Passager chez l’avionneur européen Airbus. | 6.0 | | When asked about this, an official of the American administration replied: "The United States is not conducting electronic surveillance aimed at offices of the World Bank and IMF in Washington." | | Interrogé à ce sujet, un responsable de l’administration américaine a répondu : "Les Etats-Unis n’est pas effectuer une surveillance électronique destiné aux bureaux de la Banque mondiale et du FMI à Washington". | Interrogé à ce sujet, un fonctionnaire de l’administration américaine a répondu: "Les États-Unis n’effectuent pas de surveillance électronique à l’intention des bureaux de la Banque mondiale et du FMI à Washington". | Interrogé sur le sujet, un responsable de l’administration américaine a répondu: "les Etats-Unis ne mènent pas de surveillance électronique visant les sièges de la Banque mondiale et du FMI à Washington". | 6.0 | | Martin told CNN that he asked Daley whether his then-boss knew about the potential shuffle. | | Martin a déclaré à CNN qu’il a demandé Daley si son patron de l’époque connaissaient le potentiel remaniement ministériel. | Martin a dit à CNN qu’il avait demandé à Daley si son patron d’alors était au courant du remaniement potentiel. | Martin a dit sur CNN qu’il avait demandé à Daley si son patron d’alors était au courant du remaniement éventuel. | 5.0 | | She was spotted three days later by a dog walker trapped in the quarry | | Elle a été repéré trois jours plus tard par un promeneur de chien piégé dans la carrière | Elle a été repérée trois jours plus tard par un traîneau à chiens piégé dans la carrière. | Elle a été repérée trois jours plus tard par une personne qui promenait son chien coincée dans la carrière | 5.0 | | Analysts believe the country is unlikely to slide back into full-blown conflict, but recent events have unnerved foreign investors and locals. | | Les analystes estiment que le pays a peu de chances de retomber dans un conflit total, mais les événements récents ont inquiété les investisseurs étrangers et locaux. | Selon les analystes, il est peu probable que le pays retombe dans un conflit généralisé, mais les événements récents ont attiré des investisseurs étrangers et des habitants locaux. | Les analystes pensent que le pays ne devrait pas retomber dans un conflit ouvert, mais les récents événements ont ébranlé les investisseurs étrangers et la population locale. | 5.0 |'
