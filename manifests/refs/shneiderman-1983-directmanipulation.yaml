      raw: 'Ben Shneiderman, "A Computer Graphics System for Polynomials," The Mathematics Teacher, Vol. 67, No. 2, Feb. 1974, pp. 111-113. Ben Shneiderman is an associate professor of computer science at the University of Maryland, where he is pursuing research in the design of interactive computer systems. He is the head of the recently formed Laboratory for Human-Computer Interaction within the Center for Automation Research. Shneiderman is the author of Software Psychology: Human Factors in Computer and Information Systems, the coauthor of several textbooks, and the editor of three collections of papers. He has published more than 80 research journal and conference articles.'
