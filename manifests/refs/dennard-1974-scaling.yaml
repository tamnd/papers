    - key: "18"
      raw: R. R. Troutman, "Subthreshold design considerations for insulated gate field-effect transistors," IEEE J. Solid-State Circuits, vol. SC-9, p. 55, April 1974. Robert H. Dennard (M'65) was born in Terrell, Tex., in 1932. He received the B.S. and M.S. degrees in electrical engineering from Southern Methodist University, Dallas, Tex., in 1954 and 1956, respectively, and the Ph.D. degree from Carnegie Institute of Technology, Pittsburgh, Pa., in 1958. In 1958 he joined the IBM Research Division where his experience included study of new devices and circuits for logic and memory applications, and development of advanced data communication techniques. Since 1963 he has been at the IBM T. J. Watson Research Center, Yorktown Heights, N.Y., where he worked with a group exploring large-scale integration (LSI), while making contributions in cost and yield models, MOSFET device and integrated circuit design, and FET memory cells and organizations. Since 1971 he has been manager of a group which is exploring high density digital integrated circuits using advanced technology concepts such as electron beam pattern exposure. Fritz H. Gaensslen was born in Tuebingen, Germany, on October 4, 1931. He received the Dipl. Ing and Dr. Ing. degrees in electrical engineering from the Technical University of Munich, Munich, Germany, in 1959 and 1966, respectively. Prior to 1966 he served as Assistant Professor in the Department of Electrical Engineering, Technical University of Munich, Munich, Germany. During this period he was working on the synthesis of linear and digital networks. In 1966 he joined the IBM T. J. Watson Research Center, Yorktown Heights, N.Y., where he is currently a member of a semiconductor device and process design group. His current technical interests involve various aspects of advanced integrated circuits like miniaturization, device simulation, and ion implantation. From September 1973 he was on a one year assignment at the IBM Laboratory, Böblingen, Germany. Dr. Gaensslen is a member of the Nachrichtentechnische Gesellschaft. Hwa-Nien Yu (M'65) was born in Shanghai, China, on January 17, 1929. He received the B.S., M.S., and Ph.D. degrees in electrical engineering from the University of Illinois, Urbana, in 1953, 1954, and 1958, respectively. While at the University, he was a Research Assistant in the Digital Computer Laboratory and worked on the design of the Illiac-II computer. Since joining the IBM Research Laboratory in 1957, he has been engaged in various exploratory solid-state device research activities. After working with the Advanced Systems Development Division from 1959 to 1962, he rejoined the Research Division in 1962 to work on the ultra-high speed germanium device technology. Since 1967, he has been engaged in advanced silicon LSI device technology research. He is currently the Manager of Semiconductor Technology at the IBM T. J. Watson Research Center, Yorktown Heights, N.Y. Dr. Yu is a member of Sigma Xi. V. Leo Rideout (S'61–M'65) was born in N.J. in 1941. He received the B.S.E.E. degree with honors in 1963 from the University of Wisconsin, Madison, the M.S.E.E. degree in 1964 from Stanford University, Stanford, Calif., and the Ph.D. degree in materials science in 1970 from the University of Southern California (U.S.C.), Los Angeles. His thesis work at U.S.C. under Prof. C. R. Crowell concerned thermally assisted current transport in platinum silicide Schottky barriers. From 1963 to 1965 he was a member of the technical staff of Bell Telephone Laboratories where he worked on high-frequency germanium transistors and metal-semiconductor Schottky barriers on potassium tantalate. In 1966 he spent a year as a Research Assistant in the department of Materials Science at the Technological University of Eindhoven, Eindhoven, The Netherlands, studying acoustoelectric effects in cadmium sulphide. In 1970 he joined IBM Research in the device research group of Dr. L. Esaki where he worked on fabrication and contact technology for multi-heterojunction "superlattice" structures using gallium-arsenide-phosphide and gallium-aluminum-arsenide. Since 1972 he has been a member of the semiconductor device and circuit design group of Dr. R. Dennard at the IBM T. J. Watson Research Center, Yorktown Heights, N.Y. His present research interests concern high density silicon FET technology. He is the author or co-author of 20 technical papers and 3 U.S. Patents. Dr. Rideout is a member of the Electrochemical Society, Tau Beta Pi, Eta Kappa Nu, Phi Kappa Phi, and Sigma Xi. Ernest Bassous was born in Alexandria, Egypt, on September 1, 1931. He received the B.Sc. degree in chemistry from the University of London, London, England in 1953, and the M.S. degree in physical chemistry from the Polytechnic Institute of Brooklyn, Brooklyn, N.Y. in 1965. From 1954 to 1959 he taught Chemistry and Physics at the British Boys' School, Alexandria, Egypt. He went to France in 1959 where he worked for 1 year on infrared detectors at the Centre National d'Etudes des Telecommunications, Issy-les-Moulineaux, Seine. From 1960 to 1964 he worked at the Thomas A. Edison Research Laboratory in West Orange, N.J., where his activities included studies in arc discharge phenomena, ultra violet absorption spectroscopy, and organic semiconductors. In 1964 he joined the IBM Research Laboratory, Yorktown Heights, N.Y., to work on semiconductors. As a member of the Research staff he is presently engaged in the study of materials and processes used in the fabrication of silicon integrated circuits. Mr. Bassous is a member of the Electrochemical Society and the American Association for the Advancement of Science. Andre R. LeBlanc (M'74) received the B.S. degree in electrical engineering, and the M.S. degree in physics from the University of Vermont, Burlington, in 1956 and 1959, respectively, and the D.Sc. degree in electrical engineering from the University of New Mexico, Albuquerque, in 1962. Prior to joining IBM, Essex Junction, Vt., in 1957, he was affiliated with G.E. as an electrical engineer and also with Sandia Corporation in conjunction with the University of New Mexico. In 1959 he took an educational leave of absence to complete his doctorate. He is presently a member of the Exploratory Memory Group at the IBM Laboratory, Essex Junction, where his current technical interest includes a study of short-channel MOSFET devices. He has authored five publications and twelve papers, as well as several IBM Technical Reports. Dr. LeBlanc is a member of Sigma Xi and Tau Beta Pi.
