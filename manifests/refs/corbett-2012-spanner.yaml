    - key: "42"
      raw: 'VoltDB. VoltDB Resources. 2012. A Paxos Leader-Lease Management The simplest means to ensure the disjointness of Paxos-leader-lease intervals would be for a leader to issue a synchronous Paxos write of the lease interval, whenever it would be extended. A subsequent leader would read the interval and wait until that interval has passed. TrueTime can be used to ensure disjointness without these extra log writes. The potential ith leader keeps a lower bound on the start of a lease vote from replica r as $v_{i,r}^{leader} = TT.now().earliest$, computed before $e_{i,r}^{send}$ (defined as when the lease request is sent by the leader). Each replica r grants a lease at lease $e_{i,r}^{grant}$, which happens after $e_{i,r}^{receive}$ (when the replica receives a lease request); the lease ends at $t_{i,r}^{end} = TT.now().latest + 10$, computed after $e_{i,r}^{receive}$. A replica r obeys the single-vote rule: it will not grant another lease vote until $TT.after(t_{i,r}^{end})$ is true. To enforce this rule across different incarnations of r, Spanner logs a lease vote at the granting replica before granting the lease; this log write can be piggybacked upon existing Paxos-protocol log writes. When the ith leader receives a quorum of votes (event $e_i^{quorum}$), it computes its lease interval as $lease_i = [TT.now().latest, min_r(v_{i,r}^{leader}) + 10]$. The lease is deemed to have expired at the leader when $TT.before(min_r(v_{i,r}^{leader}) + 10)$ is false. To prove disjointness, we make use of the fact that the ith and $(i+1)$th leaders must have one replica in common in their quorums. Call that replica r0. Proof: $$ \begin{align*} lease_i.end &= min_r(v_{i,r}^{leader}) + 10 & \text{(by definition)} \\ min_r(v_{i,r}^{leader}) + 10 &\leq v_{i,r0}^{leader} + 10 & \text{(min)} \\ v_{i,r0}^{leader} + 10 &\leq t_{abs}(e_{i,r0}^{send}) + 10 & \text{(by definition)} \\ t_{abs}(e_{i,r0}^{send}) + 10 &\leq t_{abs}(e_{i,r0}^{receive}) + 10 & \text{(causality)} \\ t_{abs}(e_{i,r0}^{receive}) + 10 &\leq t_{i,r0}^{end} & \text{(by definition)} \\ t_{i,r0}^{end} &< t_{abs}(e_{i+1,r0}^{grant}) & \text{(single-vote)} \\ t_{abs}(e_{i+1,r0}^{grant}) &\leq t_{abs}(e_{i+1}^{quorum}) & \text{(causality)} \\ t_{abs}(e_{i+1}^{quorum}) &\leq lease_{i+1}.start & \text{(by definition)} \end{align*} $$'
      title: VoltDB
      year: 2012
      resolves_to: ""
