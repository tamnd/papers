      caption: 'Figure 2: Example of a net with 8 input units, 4 output units, and 2 memory cell blocks of size 2. in 1 marks the input gate, out 1 marks the output gate, and cell 1 =block 1 marks the rst memory cell of block 1. cell 1 =block 1 ''s architecture is identical to the one in Figure 1, with gate units in 1 and out 1 (note that by rotating Figure 1 by 90 degrees anti-clockwise, it will match with the corresponding parts of Figure 1). The example assumes dense connectivity: each gate unit and each memory cell see all non-output units. For simplicity, however, outgoing weights of only one type of unit are shown for each layer. With the ecient, truncated update rule, error ows only through connections to output units, and through xed self-connections within cell blocks (not shown here | see Figure 1). Error ow is truncated once it \wants" to leave memory cells or gate units. Therefore, no connection shown above serves to propagate error back to the unit from which the connection originates (except for connections to output units), although the connections themselves are modi able. That''s why the truncated LSTM algorithm is so ecient, despite its ability to bridge very long time lags. See text and appendix A.1 for details. Figure 2 actually shows the architecture used for Experiment 6a | only the bias of the non-input units is omitted.'
