    - paper: brown-2020-gpt3
      figure: f01
      number: "1.1"
      page: 3
      bbox: [71.88, 148.68, 472.08, 342.72]
      caption: 'Figure 1.1: Language model meta-learning. During unsupervised pre-training, a language model develops a broad set of skills and pattern recognition abilities. It then uses these abilities at inference time to rapidly adapt to or recognize the desired task. We use the term “in-context learning” to describe the inner loop of this process, which occurs within the forward-pass upon each sequence. The sequences in this diagram are not intended to be representative of the data a model would see during pre-training, but are intended to show that there are sometimes repeated sub-tasks embedded within a single sequence.'
      sha256: 13e0d1b622c402869f316ac1e7a07599ff1d1d89203105bac0cc2eee9c4eaabb
      method: raster
      page_fraction: 0.1602
      width: 3335
      height: 1617
      bytes: 181876
    - paper: brown-2020-gpt3
      figure: f02
      number: "1.2"
      page: 4
      bbox: [118.32, 517.92, 492.96, 718.8]
      caption: 'Figure 1.2: Larger models make increasingly efficient use of in-context information. We show in-context learning performance on a simple task requiring the model to remove random symbols from a word, both with and without a natural language task description (see Sec. 3.9.2). The steeper “in-context learning curves” for large models demonstrate improved ability to learn a task from contextual information. We see qualitatively similar behavior across a wide range of tasks.'
      sha256: 629ee03c88bb86518bbca1425be344e26e60b21c775e9e7a35b599b2e057b29c
      method: raster
      page_fraction: 0.1553
      width: 3122
      height: 1674
      bytes: 214709
    - paper: brown-2020-gpt3
      figure: f03
      number: "1.3"
      page: 5
      bbox: [141.99, 518.06, 469.58, 720]
      caption: 'Figure 1.3: Aggregate performance for all 42 accuracy-denominated benchmarks While zero-shot performance improves steadily with model size, few-shot performance increases more rapidly, demonstrating that larger models are more proficient at in-context learning. See Figure 3.8 for a more detailed analysis on SuperGLUE, a standard NLP benchmark suite.'
      sha256: 7ece61c5ff88e942aef686b5db762b40b396506dda93796c3688221b8914be30
