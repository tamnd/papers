    - paper: brown-2020-gpt3
      figure: f04
      number: "2.1"
      page: 7
      bbox: [118.32, 390.36, 493.68, 719.4]
      caption: 'Figure 2.1: Zero-shot, one-shot and few-shot, contrasted with traditional fine-tuning. The panels above show four methods for performing a task with a language model – fine-tuning is the traditional method, whereas zero-, one-, and few-shot, which we study in this work, require the model to perform the task with only forward passes at test time. We typically present the model with a few dozen examples in the few shot setting. Exact phrasings for all task descriptions, examples and prompts can be found in Appendix G.'
      sha256: 89cb19bae1bece68db151aed24120d3411fc73a074322c7e3843c8e51761b361
      method: raster
      page_fraction: 0.25
      width: 3128
      height: 2742
      bytes: 413196
    - paper: brown-2020-gpt3
      figure: f05
      number: "2.2"
      page: 9
      bbox: [96.38, 486.25, 516.88, 718.88]
      caption: 'Figure 2.2: Total compute used during training. Based on the analysis in Scaling Laws For Neural Language Models [KMH + 20] we train much larger models on many fewer tokens than is typical. As a consequence, although GPT-3 3B is almost 10x larger than RoBERTa-Large (355M params), both models took roughly 50 petaflop/s-days of compute during pre-training. Methodology for these calculations can be found in Appendix D.'
      sha256: b4fc9933781e2a0a1e12c631f7ee834b318a3f2936de54562ceeb86066e78546
      method: raster
      page_fraction: 0.2
