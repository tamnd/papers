    - paper: goodfellow-2014-gan
      figure: f01
      number: "1"
      page: 3
      bbox: [115.44, 330, 497.28, 445.44]
      caption: 'Figure 1: Generative adversarial nets are trained by simultaneously updating the discriminative distribution (D, blue, dashed line) so that it discriminates between samples from the data generating distribution (black, dotted line) p x from those of the generative distribution p g (G) (green, solid line). The lower horizontal line is the domain from which z is sampled, in this case uniformly. The horizontal line above is part of the domain of x. The upward arrows show how the mapping x = G(z) imposes the non-uniform distribution p g on transformed samples. G contracts in regions of high density and expands in regions of low density of p g . (a) Consider an adversarial pair near convergence: p g is similar to p data and D is a partially accurate classifier.'
      sha256: d4d9f5a22022e3a5705cacfce5d2079dce821701f3fb7dedd74eea0bdf814837
      method: vector
      page_fraction: 0.09
      width: 1591
      height: 481
      bytes: 59602
    - paper: goodfellow-2014-gan
      figure: f02
      number: "2"
      page: 6
      bbox: [112.85, 167.87, 501.17, 435.64]
      caption: 'Figure 2: Visualization of samples from the model. Rightmost column shows the nearest training example of the neighboring sample, in order to demonstrate that the model has not memorized the training set. Samples are fair random draws, not cherry-picked. Unlike most other visualizations of deep generative models, these images show actual samples from the model distributions, not conditional means given samples of hidden units. Moreover, these samples are uncorrelated because the sampling process does not depend on Markov chain mixing. a) MNIST b) TFD c) CIFAR-10 (fully connected model) d) CIFAR-10 (convolutional discriminator and “deconvolutional” generator)'
      sha256: 9d47d4af1e1a74ef4e5144acbf84027c9531c3be4ab9cc8429fd8821bc746e77
