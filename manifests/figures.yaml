      bbox: [58.32, 598.88, 372.96, 784.64]
      caption: 'Figure 10--Special devices channel 5c1 Executive Control 5c1a This is essentially a sophisticated multiplexer that allows independent, asynchronous access to core from any of the 6 controllers connected to it. Its functions are the following: 5c1a1 Decoding instructions from the computer and passing them along as signals to the controllers. 5c1a2 Accepting addresses and requests for memory access (input or output) from the controllers, determining rela tive priority among the controllers, syn chronizing to the computer clock, and passing the requests along to memory via the MIC. 5c1b The executive control includes a comprehensive debugging panel that allows any of the 6 controllers to be operated off line without interfering with the operation of other controllers. 5c2 Disc File 5c2a This is a Model 4061 Bryant disc, selected for compatibility with the continued 940-system development by Berkeley''s Project GENIE, where extensive file handling software was developed. 5c2b As formatted for our use, the disc will have a storage capacity of approximately 32 million words, with a data-transfer rate of roughly 40,000 words per second and average access time of 85 milliseconds. 5c2c The disc controller was designed by Bryant in close cooperation with SRI and Project GENIE. 5c3 Display System 5c3a The display systems consists of two identical subsystems, each with display controller, display generator, 6 CRT''s, and 6 closed-circuit television systems. 5c3b The display controllers process display-command tables and display lists that are resident in core, and pass along display-buffer contents to the display genera tors. 5c3c The display generators and CRT''s were developed by Tasker Industries to our specifications. Each has general character vector plotting capability They will accept display buffers consisting of instructions (beam motion, character writing, etc. ) from the controller. Each will drive six 5-inch high-resolution CRT''s on which the display pictures are produced.'
