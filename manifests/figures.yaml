    - paper: sutskever-2014-seq2seq
      figure: f01
      number: "1"
      page: 2
      bbox: [127.2, 394.08, 484.8, 465.6]
      caption: 'Figure 1: Our model reads an input sentence “ABC” and produces “WXYZ” as the output sentence. The model stops making predictions after outputting the end-of-sentence token. Note that the LSTM reads the input sentence in reverse, because doing so introduces many short term dependencies in the data that make the optimization problem much easier.'
      sha256: 9f85dce633b386294dcd02edd93a5e924ec435a9dadcfa04cdec81a0936f33b3
      method: vector
      page_fraction: 0.05
      width: 1490
      height: 298
      bytes: 11511
    - paper: sutskever-2014-seq2seq
      figure: f02
      number: "2"
      page: 6
      bbox: [136.08, 164.88, 484.8, 284.16]
      caption: 'Figure 2: The figure shows a 2-dimensional PCA projection of the LSTM hidden states that are obtained after processing the phrases in the figures. The phrases are clustered by meaning, which in these examples is primarily a function of word order, which would be difficult to capture with a bag-of-words model. Notice that both clusters have similar internal structure.'
      sha256: 968456088a3d42e0035b0cfd769a33ea1d147fcff8a84a8d4013f86ad2ef8b40
      method: vector
      page_fraction: 0.09
      width: 1453
      height: 497
      bytes: 59594
    - paper: sutskever-2014-seq2seq
      figure: f03
      number: "3"
      page: 7
      bbox: [144.48, 239.76, 470.64, 405.36]
      caption: 'Figure 3: The left plot shows the performance of our system as a function of sentence length, where the x-axis corresponds to the test sentences sorted by their length and is marked by the actual sequence lengths. There is no degradation on sentences with less than 35 words, there is only a minor degradation on the longest sentences. The right plot shows the LSTM’s performance on sentences with progressively more rare words, where the x-axis corresponds to the test sentences sorted by their “average word frequency rank”.'
      sha256: 4874e1b715a004cc272b56fcc220de8fef3e32c8f8711941d1c3ac571a242a18
