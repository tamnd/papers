      bbox: [58.32, 575.6, 371.52, 814.4]
      caption: 'Figure 9-- Basic organization of NLS showing use of compilers and compiler-compiler to implement it 4d2 The Tree Meta Translator is a processor specially designed to produce new translators. 4d2a There is a special language the Tree Meta Language--for use in describing the translator to be produced. 4d2b A special Tree Meta library of subroutines must be used, along with the output of the Tree Meta Translator, to produce a functioning new translator. The same library serves for every translator it produces. 4d5 For programming the various subroutines used in our 940 systems, we have developed a special Machine-Oriented Language (MOL), together with an MOL Translator to convert MOL program descriptions into machine code (see Ref. Hay1 for a complete description) . 4d3a The MOL is designed to facilitate system programming, by providing a high level language for iterative, conditional, and arithmetic operations, etc., along with a block structure and conventions for labeling that fit our structured-statement on line manipulation aids. 4d3a1 These permit sophisticated computer aid where suitable, and also allow the programmer to switch to machine level coding (with full access to variables, labels, etc.) where core space, speed, timing, core-mapping arrangements, etc., are critical. 4d4 The NLS is organized as follows (letters refer to Figure 9): 4d4a The Control Processor (E) receives and processes successive user actions, and calls upon subroutines in the library (H) to provide it such services as the following: 4d4a1 Putting display feedback on the screen 4d4a2 Locating certain data in the file 4d4a3 Manipulating certain working data 4d4a4 Constructing a display view of specified data according to given view ing parameters, etc. 4d4b The NLS library subroutines (H) are produced from MOL programs (F), as translated by the'
      sha256: 6394dcde8b4b8b3007067c92a5f6cdbd6b70c8831cfdf98382b7f10f13151ae3
