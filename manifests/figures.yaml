      bbox: [156, 455.76, 450.96, 766.56]
      caption: 'Fig. 13. Hierarchical control of authority to modify access control lists. Each access controller has an extra field in addition to those of Fig. 12; the extra field contains the unique identifier of some higher level access controller. Authority to access segments A, X, and Y is controlled by access controllers AC 1 , AC 2 , and AC 3 , respectively. Authority to modify AC 1 and AC 2 : is in turn controlled by AC 4 , while authority to modify AC 3 is controlled by AC 5 . Authority to modify AC 4 and AC 5 , is controlled by AC 6 , which is the first access controller in the system. In this example, the authority to modify AC 6 is similar to the self-control scheme. Note that segments S4, S5, and S6 may be degenerate; AC 4 , AC 5 , and AC 6 may exist solely to control the authority to modify other access controllers. The meaning of the backpointer, say, from AC 1 to AC 1 , is that if a user attempts to modify the access control list of AC 1 , the backpointer is foUowed, leading to AC 1 . Only if the user''s principal identifier h found in AC 4 (with appropriate permission) is the modification to AC 1 permitted. Segments A, X, and Y are arranged in an independent hierarchy of their own, with A superior to X and Y, by virtue of the pointer values P 1 and P 2 found in segment A.'
