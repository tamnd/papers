    - paper: brown-2020-gpt3
      figure: f06
      number: "3.1"
      page: 11
      bbox: [166.13, 485.01, 457.82, 708.25]
      caption: 'Figure 3.1: Smooth scaling of performance with compute. Performance (measured in terms of cross-entropy validation loss) follows a power-law trend with the amount of compute used for training. The power-law behavior observed in [KMH + 20] continues for an additional two orders of magnitude with only small deviations from the predicted curve. For this figure, we exclude embedding parameters from compute and parameter counts.'
