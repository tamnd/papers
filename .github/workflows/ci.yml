name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - run: pip install --disable-pip-version-check pyyaml

      # Ids, fields, numbers, prerequisites, collection members, and the rule
      # that no PDF is tracked here under any licence.
      - name: check manifests
        run: python .github/scripts/check_manifests.py

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # The audit is the contract this corpus is held to and it lives in the
      # toolchain repository, so CI installs the toolchain rather than keeping
      # a second copy of the rules here.
      # Pinned to a release rather than to a branch. A branch would mean this
      # corpus starts failing the moment somebody pushes to the toolchain,
      # which is a change to a different repository breaking this one with no
      # commit here to point at.
      # The pin has to be moved when the toolchain releases, and moving it is
      # part of the work of a release rather than an afterthought. Left alone
      # it quietly does the opposite of its job: this pin sat at v0.1.0 while
      # the audit grew from eight rules to fifty five, so every green tick
      # here for three releases meant eight rules passed.
      - name: install papers
        run: go install github.com/tamnd/papers-reader/cmd/papers@v0.3.0

      - name: papers audit --hard
        env:
          PAPERS_CORPUS: ${{ github.workspace }}
        run: papers audit --hard
